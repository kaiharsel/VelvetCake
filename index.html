<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <!-- Run first: never restore the previous scroll position on reload, and
         start every load at the very top (mobile + desktop). -->
    <script>
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual'
      window.addEventListener('beforeunload', function () {
        window.scrollTo(0, 0)
      })
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0C0809" />

    <title>VelvetCake | Торти, весільні торти, капкейки, бенто у Львові</title>
    <meta
      name="description"
      content="VelvetCake — торти, весільні торти, капкейки та бенто у Львові. Також кенді-бари, десерти й майстер-класи ручної роботи. Швидке замовлення за телефоном 093 106 79 43"
    />
    <meta name="author" content="VelvetCake" />
    <link rel="canonical" href="https://velvetcake.example/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VelvetCake" />
    <meta property="og:title" content="VelvetCake | Торти, весільні торти, капкейки, бенто у Львові" />
    <meta
      property="og:description"
      content="Торти, весільні торти, капкейки та бенто у Львові. Також кенді-бари, десерти й майстер-класи ручної роботи"
    />
    <meta property="og:image" content="/og.jpg" />
    <meta property="og:locale" content="uk_UA" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts — loaded non-render-blocking; display=swap shows fallback text immediately -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
